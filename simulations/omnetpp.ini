[General]
network = vanet_blackhole.BasicVANET
sim-time-limit = 15s

# AODV handles route discovery
*.configurator.addStaticRoutes = false

# ARP
**.arp.typename = "GlobalArp"

# Wireless background noise
*.radioMedium.backgroundNoise.power = -110dBm

# Fixed vehicle positions
*.vehicle*.mobility.typename = "StationaryMobility"
*.vehicle*.mobility.initFromDisplayString = false

*.vehicle0.mobility.initialX = 0m
*.vehicle0.mobility.initialY = 0m

*.vehicle1.mobility.initialX = 125m
*.vehicle1.mobility.initialY = 0m

*.vehicle2.mobility.initialX = 125m
*.vehicle2.mobility.initialY = 125m

*.vehicle3.mobility.initialX = 0m
*.vehicle3.mobility.initialY = 125m

# Wireless transmitter power
*.vehicle*.wlan[0].radio.transmitter.power = 1mW

#CASE 2  :blakhole attack congfig
[Config BlackholeAttack]
extends = General
*.vehicle1.typename = "vanet_blackhole.BlackholeAodvRouter"

#CASE 3 : blackholwwithmitigation
[Config BlackholeWithMitigation]
extends = BlackholeAttack
*.vehicle0.typename = "vanet_blackhole.TrustAwareAodvRouter"
 