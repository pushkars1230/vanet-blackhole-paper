[General]
**.vector-recording = false
network = Scenario
image-path = ../../../inet-4.5.4/images:../../../veins-5.3.1/images
sim-time-limit = 60s
cmdenv-express-mode = true

# Radio (802.11p, as in veins_inet example)
*.node[*].wlan[0].opMode = "p"
*.node[*].wlan[0].radio.typename = "Ieee80211DimensionalRadio"
*.node[*].wlan[0].radio.bandName = "5.9 GHz"
*.node[*].wlan[0].radio.channelNumber = 3
*.node[*].wlan[0].radio.transmitter.power = 20mW
*.node[*].wlan[0].radio.bandwidth = 10 MHz
*.node[*].wlan[0].**.rateSelection.dataFrameBitrate = 6Mbps
*.node[*].wlan[0].**.rateSelection.multicastFrameBitrate = 6Mbps
*.node[*].wlan[*].radio.antenna.mobility.typename = "AttachedMobility"
*.node[*].wlan[*].radio.antenna.mobility.mobilityModule = "^.^.^.^.mobility"
*.node[*].wlan[*].radio.antenna.mobility.offsetX = -2.5m
*.node[*].wlan[*].radio.antenna.mobility.offsetZ = 1.5m
*.node[*].wlan[*].radio.antenna.mobility.constraintAreaMinX = 0m
*.node[*].wlan[*].radio.antenna.mobility.constraintAreaMaxX = 0m
*.node[*].wlan[*].radio.antenna.mobility.constraintAreaMinY = 0m
*.node[*].wlan[*].radio.antenna.mobility.constraintAreaMaxY = 0m
*.node[*].wlan[*].radio.antenna.mobility.constraintAreaMinZ = 0m
*.node[*].wlan[*].radio.antenna.mobility.constraintAreaMaxZ = 0m

# Addressing
*.node[*].ipv4.configurator.typename = "HostAutoConfigurator"
*.node[*].ipv4.configurator.interfaces = "wlan0"
*.node[*].ipv4.configurator.mcastGroups = "224.0.0.1"

# Mobility + SUMO
*.node[*].mobility.typename = "VeinsInetMobility"
*.manager.updateInterval = 0.1s
*.manager.autoShutdown = true
*.manager.configFile = "grid.sumocfg"
*.manager.moduleType = "VanetAodvCar"

# Buildings block radio
*.physicalEnvironment.config = xmldoc("obstacles.xml")
*.radioMedium.obstacleLoss.typename = "IdealObstacleLoss"
*.visualizer.osgVisualizer.typename = ""

# AccidentApp: node[0] -> node[2]
*.node[*].numApps = 1
*.node[*].app[0].typename = "vanet_blackhole.AccidentApp"
*.node[*].app[0].localPort = 5000
*.node[*].app[0].destPort = 5000
*.node[*].app[0].ackTimeout = 2s
*.node[*].app[0].accidentTime = 30s
*.node[0].app[0].destAddress = "auto"
*.node[*].app[0].destAddress = ""



[Config BlackholeAttack]
*.node[1].aodv.typename = "vanet_blackhole.BlackholeAodv"

[Config BlackholeWithMitigation]
extends = BlackholeAttack
*.node[0].aodv.typename = "vanet_blackhole.TrustAwareAodv"

[Config Sweep]
description = "blackhole fraction x detection mode x 10 seeds"
repeat = 30
seed-set = ${repetition}
*.manager.seed = ${repetition}
*.node[*].aodv.typename = "vanet_blackhole.VanetAodv"
*.node[0].aodv.isBlackhole = false
*.node[*].aodv.isBlackhole = uniform(0,1) < ${bhFraction=0, 0.05, 0.10, 0.15, 0.20}
*.node[*].aodv.detectionMode = ${detection="none", "ackTimeout", "plausibility"}
*.node[*].aodv.maxRange = ${maxRange=330m}

[Config Visual]
extends = Sweep
description = "watch one run: sumo-gui + Qtenv"
*.manager.command = "sumo-gui"
*.manager.commandLine = "$command --remote-port $port --seed $seed --configuration-file $configFile --start --delay 50"
*.visualizer.*.dataLinkVisualizer.displayLinks = true
*.visualizer.*.networkRouteVisualizer.displayRoutes = true

[Config Density]
extends = Sweep
description = "vehicle density 40 and 120 (80 is the Sweep config)"
*.manager.configFile = "grid${N=40,120}.sumocfg"

[Config Stream]
extends = Sweep
description = "25 warnings at 1 s intervals: throughput, delay and routing-overhead metrics"
*.node[0].app[0].sendInterval = 1s
*.node[0].app[0].numWarnings = 25
*.node[*].app[0].packetBytes = 512

[Config Highway]
extends = Stream
description = "5 km two-way highway, no buildings, 25 warnings at 1 s intervals"
*.manager.configFile = "hwy.sumocfg"
*.physicalEnvironment.config = xml("<environment/>")
*.radioMedium.obstacleLoss.typename = ""

[Config Adaptive]
description = "adaptive vs fixed vs oracle R_max at 10/20/40 mW"
repeat = 30
seed-set = ${repetition}
*.manager.seed = ${repetition}
*.node[*].aodv.typename = "vanet_blackhole.VanetAodv"
*.node[0].aodv.isBlackhole = false
*.node[*].aodv.isBlackhole = uniform(0,1) < ${bhFraction=0, 0.05}
*.node[*].wlan[0].radio.transmitter.power = ${power=10mW, 20mW, 40mW}
*.node[*].aodv.useHelloMessages = true
*.node[*].aodv.helloInterval = 1s
*.node[*].aodv.detectionMode = ${det="none", "plausibility"}
*.node[*].aodv.rangeMode = (${rm="fixed", "oracle", "adaptive"} == "adaptive") ? "adaptive" : "fixed"
*.node[*].aodv.maxRange = (${rm} == "oracle") ? ${oracle=230, 330, 460 ! power}m : 330m
*.node[*].aodv.rangeMargin = ${margin=0, 0.1, 0.25}
*.node[*].aodv.rangeWindow = 0s
*.node[*].aodv.rangeFallback = 0m
constraint = ($det == "none" && $rm == "fixed" && $margin == 0) || ($det == "plausibility" && ($rm == "adaptive" || $margin == 0))

[Config Coop]
description = "cooperative adaptive R_max at 10/20/40 mW"
repeat = 30
seed-set = ${repetition}
*.manager.seed = ${repetition}
*.node[*].aodv.typename = "vanet_blackhole.VanetAodv"
*.node[0].aodv.isBlackhole = false
*.node[*].aodv.isBlackhole = uniform(0,1) < ${bhFraction=0, 0.05}
*.node[*].wlan[0].radio.transmitter.power = ${power=10mW, 20mW, 40mW}
*.node[*].aodv.useHelloMessages = true
*.node[*].aodv.helloInterval = 1s
*.node[*].aodv.detectionMode = ${det="plausibility"}
*.node[*].aodv.rangeMode = ${rm="cooperative"}
*.node[*].aodv.maxRange = 330m
*.node[*].aodv.rangeMargin = ${margin=0, 0.1, 0.25}
*.node[*].aodv.rangeWindow = 0s
*.node[*].aodv.rangeFallback = 0m

[Config HighwayCoop]
extends = Highway
description = "highway: fixed vs cooperative bound, hellos on"
*.node[*].aodv.useHelloMessages = true
*.node[*].aodv.helloInterval = 1s
*.node[*].aodv.rangeMode = ${rm="fixed", "cooperative"}
*.node[*].aodv.rangeMargin = 0
constraint = $bhFraction <= 0.05 && $detection != "ackTimeout" && ($detection == "plausibility" || $rm == "fixed")

[Config CoopFading]
description = "Nakagami fading: fixed 330 m vs cooperative bound at 20 mW"
repeat = 30
seed-set = ${repetition}
*.manager.seed = ${repetition}
*.node[*].aodv.typename = "vanet_blackhole.VanetAodv"
*.node[0].aodv.isBlackhole = false
*.node[*].aodv.isBlackhole = uniform(0,1) < ${bhFraction=0, 0.05}
*.radioMedium.pathLoss.typename = "NakagamiFading"
*.radioMedium.pathLoss.shapeFactor = ${m=1, 3}
*.node[*].aodv.useHelloMessages = true
*.node[*].aodv.helloInterval = 1s
*.node[*].aodv.detectionMode = ${det="none", "plausibility"}
*.node[*].aodv.rangeMode = ${rm="fixed", "cooperative"}
*.node[*].aodv.maxRange = 330m
*.node[*].aodv.rangeMargin = 0
*.node[*].aodv.rangeWindow = 0s
*.node[*].aodv.rangeFallback = 0m
constraint = $det == "plausibility" || $rm == "fixed"

[Config PosError]
description = "GPS error and beacon staleness: fixed 330 m vs cooperative bound, 20 mW"
repeat = 30
seed-set = ${repetition}
*.manager.seed = ${repetition}
num-rngs = 2
*.node[*].aodv.rng-1 = 1
*.node[*].aodv.typename = "vanet_blackhole.VanetAodv"
*.node[0].aodv.isBlackhole = false
*.node[*].aodv.isBlackhole = uniform(0,1) < ${bhFraction=0, 0.05}
*.node[*].aodv.useHelloMessages = true
*.node[*].aodv.helloInterval = 1s
*.node[*].aodv.detectionMode = ${det="none", "plausibility"}
*.node[*].aodv.rangeMode = ${rm="fixed", "cooperative"}
*.node[*].aodv.maxRange = 330m
*.node[*].aodv.rangeMargin = 0
*.node[*].aodv.posErrorStd = ${sigma=0, 5, 10}m
*.node[*].aodv.beaconInterval = ${beacon=0, 1}s
constraint = $det == "plausibility" || $rm == "fixed"


[Config DpbhaGrid]
extends = Stream
description = "grid stream: none / DPBHA / fixed / cooperative / DPBHA+fixed, classic and low-jump attackers"
*.node[*].aodv.useHelloMessages = true
*.node[*].aodv.helloInterval = 1s
*.node[*].aodv.dpbha = ${dpbha=false, true}
*.node[*].aodv.rangeMode = ${rm="fixed", "cooperative"}
*.node[*].aodv.rangeMargin = 0
*.node[*].aodv.rangeWindow = 0s
constraint = $bhFraction <= 0.1 && $detection != "ackTimeout" && ($detection == "plausibility" || $rm == "fixed") && ($dpbha == false || $rm == "fixed")

[Config DpbhaHighway]
extends = Highway
description = "highway stream: same five variants and two attackers"
*.node[*].aodv.useHelloMessages = true
*.node[*].aodv.helloInterval = 1s
*.node[*].aodv.dpbha = ${dpbha=false, true}
*.node[*].aodv.rangeMode = ${rm="fixed", "cooperative"}
*.node[*].aodv.rangeMargin = 0
*.node[*].aodv.rangeWindow = 0s
constraint = $bhFraction <= 0.1 && $detection != "ackTimeout" && ($detection == "plausibility" || $rm == "fixed") && ($dpbha == false || $rm == "fixed")

# ---- v7: DPBHA sensitivity and cooperative-bound poisoning (pair with DpbhaGrid/DpbhaHighway) ----

[Config DpbhaSensGrid]
extends = DpbhaGrid
description = "DPBHA sensitivity: collection window 0.05-0.3 s, alarm off/on"
*.node[*].aodv.dpbhaCollectTime = ${win=0.05, 0.1, 0.2, 0.3}s
*.node[*].aodv.dpbhaAlarm = ${alarm=false, true}
constraint = $dpbha == true && $detection == "none" && $rm == "fixed" && $bhFraction > 0 && $bhFraction <= 0.1 && ($win != 0.1 || $alarm == true)

[Config DpbhaSensHighway]
extends = DpbhaHighway
description = "DPBHA sensitivity on the highway"
*.node[*].aodv.dpbhaCollectTime = ${win=0.05, 0.1, 0.2, 0.3}s
*.node[*].aodv.dpbhaAlarm = ${alarm=false, true}
constraint = $dpbha == true && $detection == "none" && $rm == "fixed" && $bhFraction > 0 && $bhFraction <= 0.1 && ($win != 0.1 || $alarm == true)

[Config CoopPoisonGrid]
extends = DpbhaGrid
description = "cooperative bound with one vehicle advertising an inflated range, without/with cap"
*.node[1].aodv.poisonRange = ${poison=0, 2000}m
*.node[*].aodv.rangeCap = ${cap=0, 500}m
constraint = $detection == "plausibility" && $rm == "cooperative" && $dpbha == false && $bhFraction == 0.05 && ($poison > 0 || $cap == 0)

[Config CoopPoisonHighway]
extends = DpbhaHighway
description = "highway: cooperative bound poisoning, without/with cap"
*.node[1].aodv.poisonRange = ${poison=0, 2000}m
*.node[*].aodv.rangeCap = ${cap=0, 500}m
constraint = $detection == "plausibility" && $rm == "cooperative" && $dpbha == false && $bhFraction == 0.05 && ($poison > 0 || $cap == 0)

# ---- original 1350-run sweep of the paper (Sections 6.2-6.5), re-run with the final code ----
[Config SweepFull]
description = "blackhole fraction x detection mode x R_max x 30 seeds (paper sweep)"
repeat = 30
seed-set = ${repetition}
*.manager.seed = ${repetition}
*.node[*].aodv.typename = "vanet_blackhole.VanetAodv"
*.node[0].aodv.isBlackhole = false
*.node[*].aodv.isBlackhole = uniform(0,1) < ${bhFraction=0, 0.05, 0.10, 0.15, 0.20}
*.node[*].aodv.detectionMode = ${detection="none", "ackTimeout", "plausibility"}
*.node[*].aodv.maxRange = ${maxRange=330m, 400m, 500m}
